<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Batcave Security</title>
		<link rel="stylesheet" href="/css/output.css" />
	</head>
	<body class="p-8 space-y-8 bg-gray-900 text-white">
		<h1 class="text-4xl">Connexion</h1>
		<p id="auth-status" class="hidden rounded border border-green-400/40 bg-green-900/30 px-3 py-2 text-green-200"></p>

		<form id="register-form" method="POST" action="/auth/login" class="flex flex-col gap-8 items-center">
			<div class="flex flex-col gap-2">
				<label for="username" class="text-center">Nom d'utilisateur</label>
				<input class="bg-gray-400 text-gray-900 focus:outline-none w-80 rounded px-2 py-1" type="text" id="username" name="username" placeholder="Nom d'utilisateur" required />
			</div>

			<div class="flex flex-col gap-2">
				<label for="password" class="text-center">Mot de passe</label>
				<input class="bg-gray-400 text-gray-900 focus:outline-none w-80 rounded px-2 py-1" type="password" id="password" name="password" placeholder="Mot de passe" required />
			</div>

			<select name="role" id="role" class="bg-gray-400 px-2 py-1 cursor-pointer text-black rounded">
				<option value="USER">User</option>
				<option value="ADMIN">Admin</option>
			</select>

			<div id="local-auth-actions" class="flex items-center gap-4">
				<button type="submit" name="action" value="login" class="cursor-pointer bg-yellow-400 text-gray-900 px-2 py-1 rounded">Connexion</button>
				<button type="submit" name="action" value="register" class="cursor-pointer bg-gray-400 text-gray-900 px-2 py-1 rounded">S'inscrire</button>
			</div>

			<div id="oauth-auth-actions" class="flex flex-col items-center gap-3">
				<a href="/auth/login/google" class="inline-flex items-center gap-2 rounded bg-white px-4 py-2 font-semibold text-gray-900 hover:bg-gray-100">
					<span class="text-red-600">G</span>
					<span>Se connecter avec Google</span>
				</a>

				<a href="/auth/login/github" class="inline-flex items-center gap-2 rounded bg-gray-200 px-4 py-2 font-semibold text-gray-900 hover:bg-gray-300">
					<span>GH</span>
					<span>Se connecter avec GitHub</span>
				</a>
			</div>

			<button id="logout-button" type="button" class="hidden cursor-pointer rounded bg-yellow-400 px-4 py-2 font-semibold text-gray-900">Déconnexion</button>

			<p id="message" class="hidden"></p>

			<div id="setup-2fa-panel" class="hidden w-full max-w-xl space-y-3 rounded border border-yellow-400/40 bg-gray-800 p-4">
				<p class="text-yellow-300 font-semibold">Configuration 2FA requise</p>
				<p class="text-sm text-gray-300">Scanne ce QR code avec ton application d'authentification, puis reconnecte-toi pour saisir le code à 6 chiffres.</p>
				<div class="bg-white rounded p-1 mx-auto w-fit">
					<img id="setup-2fa-qr" alt="QR Code 2FA" class="w-56 h-56 object-contain mx-auto" />
				</div>
			</div>
			<a href="/bat-computer" class="underline underline-offset-2">Accéder au Bat Computer</a>
		</form>

		<script src="/js/register.js"></script>
	</body>
</html>
