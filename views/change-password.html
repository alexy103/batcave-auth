<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/css/output.css" />
		<title>Changer le mot de passe</title>
	</head>
	<body class="p-8 space-y-8 bg-gray-900 text-white">
		<div class="flex items-center justify-between">
			<h1 class="text-3xl font-bold text-yellow-400">Changer le mot de passe</h1>
			<a href="/bat-computer" class="text-gray-900 py-1 px-2 rounded cursor-pointer bg-yellow-400 font-semibold">Retour</a>
		</div>

		<form id="change-password-form" class="max-w-xl mx-auto space-y-4">
			<div class="flex flex-col gap-2">
				<label for="old-password">Mot de passe actuel</label>
				<input id="old-password" type="password" class="bg-gray-400 text-gray-900 rounded px-2 py-1 focus:outline-none" required />
			</div>

			<div class="flex flex-col gap-2">
				<label for="new-password">Nouveau mot de passe</label>
				<input id="new-password" type="password" class="bg-gray-400 text-gray-900 rounded px-2 py-1 focus:outline-none" minlength="12" required />
			</div>

			<div class="flex flex-col gap-2">
				<label for="confirm-password">Confirmer le nouveau mot de passe</label>
				<input id="confirm-password" type="password" class="bg-gray-400 text-gray-900 rounded px-2 py-1 focus:outline-none" minlength="12" required />
			</div>

			<button type="submit" class="text-gray-900 py-1 px-3 rounded cursor-pointer bg-yellow-400 font-semibold">Valider</button>
			<p id="message" class="hidden"></p>
		</form>

		<script src="/js/change-password.js"></script>
	</body>
</html>
