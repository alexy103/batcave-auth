<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/css/output.css" />
		<title>Test Setup 2FA</title>
	</head>
	<body class="p-8 space-y-6 bg-gray-900 text-white">
		<div class="flex items-center justify-between">
			<h1 class="text-3xl font-bold text-yellow-400">Test Setup 2FA</h1>
			<a href="/bat-computer" class="text-gray-900 py-1 px-2 rounded cursor-pointer bg-yellow-400 font-semibold">Retour</a>
		</div>

		<p>Cette page appelle la route <span class="font-mono">POST /auth/setup-2fa</span> avec vos cookies actifs.</p>

		<button id="test-setup-2fa" class="text-gray-900 py-2 px-3 rounded cursor-pointer bg-yellow-400 font-semibold">Lancer le test</button>

		<div class="space-y-2">
			<p class="text-sm uppercase tracking-wide text-gray-300">Secret de secours</p>
			<pre id="secret" class="bg-gray-800 rounded p-3 overflow-x-auto"></pre>
		</div>

		<div class="space-y-2">
			<p class="text-sm uppercase tracking-wide text-gray-300">QR Code</p>
			<div class="bg-white rounded p-4 inline-block">
				<img id="qr-image" alt="QR Code 2FA" class="w-56 h-56 object-contain" />
			</div>
		</div>

		<div class="space-y-2">
			<p class="text-sm uppercase tracking-wide text-gray-300">Réponse brute</p>
			<pre id="response" class="bg-gray-800 rounded p-3 overflow-x-auto"></pre>
		</div>
		<script src="/js/setup-2fa-test.js"></script>
	</body>
</html>
